name: CI Дозорного Гонца
 
on:
  push:
    branches: ["**"]
 
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -v
      - name: Составить донесение о проверке
        run: echo "Проверка пройдена: $(date)" > report.txt
      - name: Сохранить донесение как трофей
        uses: actions/upload-artifact@v4
        with:
          name: gonec-report
          path: report.txt
